<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagination</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Pagination</h1>

        <p class="subtitle">User Data</p>

        <!-- Table will be created using DOM -->
        <div class="table-container">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>USERNAME</th>
                        <th>EMAIL</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <!-- Data will be created using JavaScript DOM -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
            <!-- Buttons will be created using DOM -->
        </div>

    </div>

    <!-- GUVI test script -->
    <script src="https://app.zenclass.in/sheets/v1/js/zen/suite/bundle.js"></script>

    <script src="script.js"></script>

</body>
</html>
